<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ColorDecoder (CD)</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <h1>ColorDecoder (CD)</h1>

        <input type="file" id="imageInput" accept="image/*">

        <div class="controls">
            <button id="eyedropperBtn" disabled>🖌️ Pick Color</button>
            <button id="paintBtn" disabled>🎨 Paint Mode: OFF</button>
            <button id="eraserBtn" disabled>🧹 Eraser: OFF</button>
            
            <button id="undoBtn" disabled>↩️ Undo</button>
            <button id="downloadBtn" disabled>💾 Save Image</button>

            <div class="paint-tools">
                <label for="brushColor">Custom Color:</label>
                <input type="color" id="brushColor" value="#ff0000" disabled>
                
                <label for="brushSize">Size:</label>
                <input type="range" id="brushSize" min="1" max="50" value="5" disabled>
            </div>

            <div class="color-palette">
                <button class="palette-btn" style="background-color: #ff0000;" data-color="#ff0000" title="Red"></button>
                <button class="palette-btn" style="background-color: #ff4500;" data-color="#ff4500" title="Orange Red"></button>
                <button class="palette-btn" style="background-color: #ffa500;" data-color="#ffa500" title="Orange"></button>
                <button class="palette-btn" style="background-color: #ffff00;" data-color="#ffff00" title="Yellow"></button>
                <button class="palette-btn" style="background-color: #00ff00;" data-color="#00ff00" title="Lime"></button>
                <button class="palette-btn" style="background-color: #008000;" data-color="#008000" title="Green"></button>
                <button class="palette-btn" style="background-color: #00ffff;" data-color="#00ffff" title="Cyan"></button>
                <button class="palette-btn" style="background-color: #0000ff;" data-color="#0000ff" title="Blue"></button>
                <button class="palette-btn" style="background-color: #4b0082;" data-color="#4b0082" title="Indigo"></button>
                <button class="palette-btn" style="background-color: #8a2be2;" data-color="#8a2be2" title="Purple"></button>
                <button class="palette-btn" style="background-color: #ff007f;" data-color="#ff007f" title="Pink"></button>
                <button class="palette-btn" style="background-color: #8b4513;" data-color="#8b4513" title="Brown"></button>
                <button class="palette-btn" style="background-color: #ffffff;" data-color="#ffffff" title="White"></button>
                <button class="palette-btn" style="background-color: #808080;" data-color="#808080" title="Gray"></button>
                <button class="palette-btn" style="background-color: #000000;" data-color="#000000" title="Black"></button>
            </div>
        </div>

        <div class="canvas-container">
            <canvas id="imageCanvas"></canvas>
        </div>

        <div class="color-info">
            <div id="colorPreview" class="preview-box"></div>
            <div class="details">
                <p><strong>HEX:</strong> <span id="hexValue">#------</span></p>
                <p><strong>RGB:</strong> <span id="rgbValue">rgb(-, -, -)</span></p>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
